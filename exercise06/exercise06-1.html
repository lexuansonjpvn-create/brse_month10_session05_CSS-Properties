<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thẻ tin tức</title>
    <link rel="stylesheet" href="./exercise06-1.css">
</head>
<body>

    <div class="news-card">
        <!-- Phần hình ảnh và thông tin lượt xem -->
        <div class="card-media">
            <!-- Thay 'your-image.jpg' bằng đường dẫn ảnh thực tế của bạn -->
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSS3NzKWk4BtgfdvZpxC7QnhX-LPZWnrxe6h_yzjDgH9NCOY2C9pD7EK3A8&s=10" alt="Hoài Lâm và bạn gái" class="card-image">
            
            <div class="view-overlay">
                <div class="eye-badge">
                    <!-- Icon con mắt -->
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </div>
                <span class="view-count">79.174 lượt xem</span>
            </div>
        </div>

        <!-- Phần tiêu đề bài viết -->
        <div class="card-content">
            <h2 class="card-title">
                Sao Việt 14/8: Hoài Lâm xuất hiện tỉnh táo, cười rạng rỡ bên bạn gái
            </h2>
        </div>
    </div>

</body>
</html>
